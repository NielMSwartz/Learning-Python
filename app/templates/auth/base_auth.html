<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15191f">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{{ title or 'Account' }} · Python Academy</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card fade-in">
    <a class="brand" href="/">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFD43B" d="M11.9 2.2c-4.4 0-4.1 1.9-4.1 1.9l.1 2h4.1v.6H5.7S3.9 6.4 3.9 10.1s1.6 3.7 1.6 3.7h1v-2.3s-.1-1.6 1.5-1.6h4.3s1.4.1 1.4-1.4V4.4s.2-2.2-2-2.2ZM9.4 3.6a.7.7 0 1 1 0 1.4.7.7 0 0 1 0-1.4Z"/><path fill="#FFD43B" d="M12.1 21.8c4.4 0 4.1-1.9 4.1-1.9l-.1-2h-4.1v-.6h6.3s1.8-.3 1.8-3.7-1.6-3.7-1.6-3.7h-1v2.3s.1 1.6-1.5 1.6h-4.3s-1.4-.1-1.4 1.4v3.8s-.2 2.8 1.8 2.8Zm2.5-1.4a.7.7 0 1 1 0-1.4.7.7 0 0 1 0 1.4Z"/></svg>
      </span>
      <span class="brand-text"><strong>Python Academy</strong><span>learn by doing</span></span>
    </a>
    {% block auth_content %}{% endblock %}
  </div>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block auth_scripts %}{% endblock %}
</body>
</html>
