{% extends 'auth/base_auth.html' %}
{% block auth_content %}
<h1>Welcome back</h1>
<p class="muted">Sign in to continue building your Python skills.</p>
<div class="form-error" id="form-error"></div>
<form id="login-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field"><label for="identity">Username or email</label><input class="input" id="identity" autocomplete="username" required></div>
  <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password" required></div>
  <label class="small muted" style="display:flex;gap:8px;align-items:center;margin-bottom:16px"><input type="checkbox" id="remember" checked> Keep me signed in</label>
  <button class="btn btn-primary btn-block" type="submit">Sign in</button>
</form>
<div class="auth-links"><a href="{{ url_for('web.register') }}">Create an account</a><a href="{{ url_for('web.forgot') }}">Forgot password?</a></div>
{% endblock %}
{% block auth_scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async event => {
  event.preventDefault();
  const error = document.getElementById('form-error');
  error.textContent = '';
  try {
    await PA.api('/api/auth/login', { method: 'POST', body: {
      identity: document.getElementById('identity').value.trim(),
      password: document.getElementById('password').value,
      remember: document.getElementById('remember').checked
    }});
    location.href = '/';
  } catch (err) { error.textContent = err.message; }
});
</script>
{% endblock %}
